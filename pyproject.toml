[project]
name = "filingintel"
version = "0.1.0"
requires-python = ">=3.11"
description = "Citation-grounded Q&A over SEC 10-K and 10-Q filings"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=localhost,127.0.0.1,::1"
