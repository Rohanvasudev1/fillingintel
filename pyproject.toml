[project]
name = "filingintel"
version = "0.1.0"
requires-python = ">=3.11"
description = "Citation-grounded Q&A over SEC 10-K and 10-Q filings"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.7",
    "edgartools>=5.59,<6.0",
    "anthropic==1.11.0",
    "ragas==0.4.3",
    "openai==3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]
spike = [
    "edgartools>=5.59,<6.0",      # edgartools: high-level EDGAR API with inline-XBRL parsing
    "sec-parser>=0.58",     # sec-parser: structural HTML → section tree, alternative parser
    "python-dotenv>=1.0",   # python-dotenv: load .env for spike scripts (not used in prod)
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "eval", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=localhost,127.0.0.1,::1"

[tool.uv]
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2.
constraint-dependencies = ["langchain-community<0.4.2"]
