name: CI

# One run per PR push and one per push to main. No paths filters, so a required
# check is never left waiting on a skipped workflow.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: filingintel
          POSTGRES_PASSWORD: filingintel
          POSTGRES_DB: filingintel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Graph tests (Step 7). The health check runs a Bolt query, since HTTP on
      # 7474 answers a few seconds before Bolt does. Cold start can take 30 s+.
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/filingintel-ci
        options: >-
          --health-cmd "cypher-shell -u neo4j -p filingintel-ci 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
        ports:
          - 7687:7687

    env:
      DATABASE_URL: postgresql://filingintel:filingintel@localhost:5432/filingintel
      # CI-only test values, like the Postgres password above.
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_USER: neo4j
      NEO4J_TEST_PASSWORD: filingintel-ci
      POSTGRES_USER: filingintel
      POSTGRES_PASSWORD: filingintel
      POSTGRES_DB: filingintel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Placeholder value satisfies the missing-env-var guard in edgar_client;
      # no real EDGAR requests are made in CI (pytest-socket blocks all external network).
      EDGAR_USER_AGENT: "FilingIntel/CI ci-placeholder@example.com"
      # tiktoken reads cl100k_base from the vendored copy instead of downloading it.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/vendor/tiktoken
      # Ragas analytics off; eval.judging also forces this before importing ragas.
      RAGAS_DO_NOT_TRACK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Initialize pgvector extension
        run: |
          PGPASSWORD=filingintel psql -h localhost -U filingintel -d filingintel \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  # The quality gate (Step 6, ADR-0003): the vector arm's real search over the
  # committed snapshot, offline. It needs only the Postgres service; no API keys.
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: filingintel
          POSTGRES_PASSWORD: filingintel
          POSTGRES_DB: filingintel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://filingintel:filingintel@localhost:5432/filingintel
      # The gate imports neither today; set as in lint-and-test so a later import
      # can't download the encoding or send Ragas analytics.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/vendor/tiktoken
      RAGAS_DO_NOT_TRACK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Initialize pgvector extension
        run: |
          PGPASSWORD=filingintel psql -h localhost -U filingintel -d filingintel \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Loads tests/fixtures/corpus_snapshot.jsonl.gz into a throwaway schema, compares with
      # benchmarks/gate_baseline.json and appends the table to the job summary.
      # Exit 4 means a gated number dropped.
      - name: Quality gate
        run: uv run python -m eval.gate
